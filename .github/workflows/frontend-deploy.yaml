name: Deploy to S3 and CloudFront

on:
  workflow_dispatch:
  
  push:
    branches:
      - main
    paths:
      - 'Frontend-HRMS-main/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Frontend-HRMS-main/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "ap-south-1"
  AWS_ACCOUNT_ID: "683213329249"
  ROLE_TO_ASSUME: "GitHub_identity_provider"
  NODE_VERSION: "22"
  S3_BUCKET: "hrms-website-vrpi"
  CLOUDFRONT_DISTRIBUTION_ID: "EH914YPBL3WQK"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print GitHub Context
        run: |
          echo "Repository = ${{ github.repository }}"
          echo "Ref = ${{ github.ref }}"
          echo "Event = ${{ github.event_name }}"

      - name: Get OIDC Token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setOutput('token', token);

      - name: Decode OIDC Token
        run: |
          python3 - <<'PY'
          import base64, json
          token = "${{ steps.oidc.outputs.token }}"
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-role-session

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend-HRMS-main/package-lock.json


      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Clean node_modules and cache
        run: |
          rm -rf node_modules
          npm cache clean --force

      - name: Install dependencies
        working-directory: Frontend-HRMS-main
        run: npm install --legacy-peer-deps

      - name: Install caniuse-lite package
        working-directory: Frontend-HRMS-main
        run: npm install caniuse-lite --legacy-peer-deps

      - name: Install missing fonts (typeface-poppins)
        working-directory: Frontend-HRMS-main
        run: npm install --legacy-peer-deps typeface-poppins

      - name: Build React app
        working-directory: Frontend-HRMS-main
        env:
          NODE_PATH: ./src
          CI: false
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync Frontend-HRMS-main/dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
